# use zsh as default
set-option -g default-shell /bin/zsh
set-option -g allow-passthrough on   # let programs bypass tmux (image preview, Ghostty escapes)

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# What Ghostty (TERM=xterm-ghostty) can do beyond tmux's defaults: true colour, clickable
# hyperlinks and modified keys (Ctrl+Shift+x, Ctrl+Enter, <C-i> vs Tab, ... reach nvim).
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:extkeys"
set -g extended-keys on
set -g focus-events on          # nvim FocusGained/FocusLost: :checktime + autowrite on focus changes

# General
set -g update-environment "SSH_AUTH_SOCK SSH_ASKPASS SSH_GATEWAY SSH_CONNECTION SSH_TTY"
setenv -g SSH_AUTH_SOCK $HOME/.ssh/ssh-agent.sock
set -g set-clipboard on         # use system clipboard
set -g detach-on-destroy off    # don't exit from tmux when closing a session
set -g escape-time 10           # near-instant ESC in Neovim; 0 can split Alt+key (ESC+key) sequences
set -g history-limit 1000000    # increase history size (from 2,000)
set -g mouse on                 # enable mouse support
set -g status-interval 3        # update the status bar every 3 seconds

# set new prefix key
set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

# Split horizontally in CWD with \
unbind %
bind '\' split-window -h -c "#{pane_current_path}"

# Split vertically in CWD with -
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Refresh tmux config with r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Use vim arrow keys to resize
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Use m key to maximize pane
bind -r m resize-pane -Z

# Enable vi mode to allow vim movements
set-window-option -g mode-keys vi

# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection 

# Copy text with "y"
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"

# Paste yanked text with "Prefix + P" ("Prefix + p" goes to previous window)
bind P paste-buffer
 
# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set TPM to look in .config instead of standard home dir
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# List of tmux plugins
# vim-tmux-navigator: Ctrl+h/j/k/l move between tmux panes AND nvim splits (the nvim half lives
# in nvim/lua/plugins/editor/tmux.lua). Prefix + Ctrl+l still clears the screen.
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions every 15 minutes
set -g @plugin 'erikw/tmux-powerline'
set -g status-style bg=default


set-option -g status-position bottom
# Load theme
#if-shell "[[ \"$TMUX_THEME\" == \"onedark\" ]]" 'source-file ~/.config/tmux/onedark-theme.conf' ""
#if-shell "[[ \"$TMUX_THEME\" == \"nord\" ]]" 'source-file ~/.config/tmux/nord-theme.conf' ""

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set -g @plugin 'tmux-plugins/tpm'
run '~/.config/tmux/plugins/tpm/tpm'

# NOTE:
# - To apply theme changes: tmux kill-server && rm -rf /tmp/tmux-*
# - To avoid overlap, disable the Mac shortcut to switch input sources with Ctrl+Space in `System settings > Keyboard Shortcuts > Input Sources`
# - Ctrl+Space is also the prefix, so nvim never sees it: don't map <C-Space> in nvim.
# - Alt/Option combos need `macos-option-as-alt = true` in ghostty/config.
